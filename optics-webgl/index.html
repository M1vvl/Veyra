<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veyra · 光学核对</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #111820; }
    body { display: grid; justify-items: center; font-family: system-ui, sans-serif; }
    canvas { display: block; width: min(100vw, 56.25vh); height: auto; aspect-ratio: 9/16; touch-action: manipulation; }
    #error { color: #f6f8fb; padding: 20px; max-width: 500px; }
  </style>
</head>
<body>
  <canvas id="optics" width="1080" height="1920" aria-label="Liquid Glass 光学核对。点击灯光或背景按钮切换演示状态。" tabindex="0"></canvas>
  <div id="error" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
